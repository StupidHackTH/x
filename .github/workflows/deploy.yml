# Builds the site and publishes it to GitHub Pages on every push to main.
# Pages must be set to "GitHub Actions" as the source (Settings → Pages), which `gh api` did once when this was set up.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The StupidHackTH org site has the custom domain stupid.hackathon.in.th, so this project page is served at
          # https://stupid.hackathon.in.th/x/ (stupidhackth.github.io/x/ redirects there). Base path = /<repo>.
          SITE_URL: https://stupid.hackathon.in.th
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SHTX_NET_API: ${{ vars.SHTX_NET_API }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
